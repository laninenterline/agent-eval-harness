name: agent-eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run agent evaluation
        run: aeh run --cases examples/cases/cases.jsonl --traces examples/traces/otel_sample.json --out aeh-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: aeh-report
          path: aeh-report.json
      - name: Regression gate (compare against baseline if present)
        run: |
          if [ -f .github/aeh-baseline.json ]; then
            aeh diff .github/aeh-baseline.json aeh-report.json
          else
            echo "no baseline yet; skipping regression gate"
          fi
