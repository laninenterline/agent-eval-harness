[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aehcli"
version = "0.1.0"
description = "Framework-neutral, task-level evaluation and regression harness for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-eval-harness contributors" }]
keywords = ["ai", "agents", "evaluation", "evals", "opentelemetry", "observability", "ci", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/laninenterline/agent-eval-harness"
Repository = "https://github.com/laninenterline/agent-eval-harness"
Issues = "https://github.com/laninenterline/agent-eval-harness/issues"
Changelog = "https://github.com/laninenterline/agent-eval-harness/releases"

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=5.0"]

[project.scripts]
aeh = "agent_eval_harness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
